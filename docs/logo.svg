<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00E5FF" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <g filter="url(#glowCyan)">
    <path d="M150 90 L215 150 L150 210" fill="none" stroke="#00E5FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g filter="url(#glowGreen)">
    <path d="M245 196 L330 196" fill="none" stroke="#00FF9C" stroke-width="16" stroke-linecap="round"/>
  </g>

  <text x="380" y="150" font-family="Consolas, Menlo, monospace" font-size="84" font-weight="bold" fill="#E6F1FF">码上Python</text>
  <text x="384" y="212" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="bold" fill="#FF2D78">PY//NOW</text>
  <text x="580" y="212" font-family="Consolas, Menlo, monospace" font-size="26" fill="#8FA3BF">offline · cyberpunk · assert-judged</text>

  <rect x="0" y="288" width="1200" height="12" fill="#00E5FF" opacity="0.25"/>
</svg>
