name: CI

# Gate that turns the previously manual desktop verification into a mandatory
# checkpoint for every push and pull request. Any step that fails exits
# non-zero and blocks the PR/push.
on:
  push:
  pull_request:

jobs:
  desktop-engine-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pin pytest so "it is green on my machine" cannot be caused by a silently
      # different pytest major version.
      - name: Install pinned pytest
        run: pip install "pytest==8.*"
        shell: bash

      # Existing manual gate #1: engine round-trip tests (16 passed locally).
      - name: Run engine desktop tests
        run: python -m pytest tests/test_engine_desktop.py -q
        shell: bash

      # New mandatory gate (audit K1 desktop equivalent): the JSON contract the
      # Android/Kotlin bridge depends on. If a field is dropped or re-typed,
      # this fails and blocks the push/PR.
      - name: Run engine JSON contract tests
        run: python -m pytest tests/test_pybridge_contract.py -q
        shell: bash

      # Existing manual gate #2: content-pack validation (30 lessons / 130 cases).
      - name: Validate content pack
        run: python tests/validate_content.py
        shell: bash

      # NOTE (non-blocking informational comment):
      # The Kotlin/Android build (`./gradlew assembleDebug`) and its tests
      # require the Android SDK + Gradle toolchain, which is not available in
      # this Linux CI runner. The Kotlin layer currently has zero automated
      # tests (audit finding K1). We intentionally do NOT run gradle here so it
      # cannot break the gate; adding Android CI is a separate follow-up.
